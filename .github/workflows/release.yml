name: Release

# Bumps the version in package.json, package-lock.json and the Helm chart, commits and tags it,
# creates a GitHub release and dispatches the Docker image and Helm chart publish workflows on the new tag.
# The chart version is kept equal to the app version.
#
# Pushes made with GITHUB_TOKEN do not trigger other workflows, so the publish workflows are
# started explicitly with workflow_dispatch (which is allowed) on the release tag.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to bump
        type: choice
        options: [ patch, minor, major ]
        default: patch
      version:
        description: Explicit version (e.g. 3.1.0), overrides bump
        type: string
        required: false

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Bump version and publish
    runs-on: ubuntu-latest
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)

    permissions:
      contents: write
      actions: write

    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Bump version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          EXPLICIT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$EXPLICIT_VERSION" ]; then
            target="${EXPLICIT_VERSION#v}"
          else
            target="$BUMP"
          fi
          version=$(npm version "$target" --no-git-tag-version)
          version="${version#v}"
          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "::error::Tag v$version already exists"
            exit 1
          fi
          sed -i -E "s/^version:.*/version: $version/; s/^appVersion:.*/appVersion: \"$version\"/" charts/mulle-js/Chart.yaml
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing v$version"

      - name: Commit, tag and push
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json charts/mulle-js/Chart.yaml
          git commit -m "Release v$VERSION"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "HEAD:${GITHUB_REF_NAME}" "v$VERSION"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "v$VERSION" --title "v$VERSION" --generate-notes --verify-tag

      - name: Trigger publish workflows
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for workflow in build_docker.yml build_server_docker.yml publish_helm_chart.yml; do
            gh workflow run "$workflow" --ref "v$VERSION"
          done
          {
            echo "### Released v$VERSION"
            echo "Dispatched on tag \`v$VERSION\`: build_docker.yml, build_server_docker.yml, publish_helm_chart.yml"
          } >> "$GITHUB_STEP_SUMMARY"
